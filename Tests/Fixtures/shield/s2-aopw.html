const F=window.__yabFixture={name:"s2-aopw",state:"pending",collateral:"pending",effect:{},kept:{}};
let ran=false;function finish(){F.state=Object.values(F.effect).every(Boolean)?"blocked":"leaked";F.collateral=Object.values(F.kept).every(Boolean)?"ok":"broken";document.title=F.state+"/"+F.collateral;}
</script>
<script>
let threw=null;try{window.adbDetected=true}catch(e){threw=e.name}
F.effect.writeThrowsReferenceError=(threw==="ReferenceError");

finish();</script>
